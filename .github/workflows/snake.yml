name: Generate snake

on:
  schedule:
    - cron: "0 6 * * *"   # once a day
  workflow_dispatch:      # or run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#c03a1e&color_dots=#ebedf0,#ffd9cf,#ff9478,#e05a3a,#c03a1e
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff9478&color_dots=#161b22,#5c2a1f,#8f3a26,#c9503a,#ff9478

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
